name: HPE opportunity freshness
on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/nearify-*.js'
      - 'scripts/tests/test-nearify-public-feed.js'
      - 'scripts/tests/test-nearify-opportunity-intake.js'
      - 'scripts/opportunity-review-queue.js'
      - 'scripts/tests/test-opportunity-review-queue.js'
      - 'scripts/opportunity-renewal.js'
      - 'scripts/opportunity-intake.js'
      - 'scripts/opportunity-publication.js'
      - 'scripts/opportunity-supply.js'
      - 'scripts/tests/test-opportunity-publication.js'
      - 'scripts/opportunity-evidence.js'
      - 'scripts/tests/test-opportunity-evidence.js'
      - 'scripts/tests/test-opportunity-intake.js'
      - 'data/opportunity-sources-charleston.json'
      - 'scripts/tests/test-opportunity-renewal.js'
      - 'data/hpe-published-opportunities.json'
      - '.github/workflows/hpe-opportunity-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/tests/test-opportunity-renewal.js
      - run: node scripts/opportunity-renewal.js | tee opportunity-review.json
      - run: node scripts/tests/test-opportunity-publication.js
      - run: node scripts/tests/test-opportunity-intake.js
      - run: node scripts/opportunity-intake.js | tee provider-candidates.json
      - run: node scripts/tests/test-opportunity-evidence.js
      - if: github.event_name != 'pull_request'
        run: node scripts/opportunity-evidence.js > provider-evidence.json
      - run: node scripts/tests/test-nearify-public-feed.js
      - run: node scripts/tests/test-nearify-opportunity-intake.js
      - if: github.event_name != 'pull_request'
        env:
          NEARIFY_PUBLISHABLE_KEY: ${{ vars.NEARIFY_PUBLISHABLE_KEY }}
        run: node scripts/nearify-public-feed.js > nearify-candidates.json
      - run: node scripts/tests/test-opportunity-review-queue.js
      - if: github.event_name != 'pull_request'
        run: node scripts/opportunity-review-queue.js provider-candidates.json nearify-candidates.json > unified-review-queue.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opportunity-review
          path: |
            opportunity-review.json
            provider-candidates.json
            provider-evidence.json
            nearify-candidates.json
            unified-review-queue.json

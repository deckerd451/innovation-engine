name: Governor Certification Gate

# Real downstream gate on the OVM Nano Governor's certification, not just
# an optional signal: this runs on a self-hosted runner on the same local
# WiFi network as the physical device (ovm-nano.local), because GitHub's
# hosted runners cannot reach it. It fails the check unless the PR's head
# commit has verified_<revision> = TRUE on the Governor's LIVE ledger,
# fetched fresh every run -- never a cached or assumed value. Wired into
# branch protection as a required status check, so a PR genuinely cannot
# merge without this passing.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  governor-gate:
    name: Governor Certification Gate
    runs-on: [self-hosted, ovm-governor]
    timeout-minutes: 5
    steps:
      - name: Check Governor's live ledger for verified_<revision>
        run: |
          # Resolve via macOS ping: Python's mDNS lookup may fail even when
          # the device is reachable, and the device's DHCP address can change.
          ping_output="$(ping -c 1 ovm-nano.local)"
          resolved_host="$(printf '%s\n' "$ping_output" | sed -nE '1s/^PING [^(]+\(([0-9.]+)\):.*/\1/p')"
          test -n "$resolved_host"
          export OVM_HOST="$resolved_host"
          python3 /Users/douglashamilton/ovm-nano/gate_pr.py "${{ github.event.pull_request.head.sha }}"
